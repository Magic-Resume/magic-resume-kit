name: Package checks
on:
  push:
    branches: [main, 'codex/**', 'release-*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:packages
      - run: pnpm test:consumer
      - uses: actions/upload-artifact@v4
        with:
          name: public-packages
          path: .artifacts/*.tgz
          include-hidden-files: true
          if-no-files-found: error
